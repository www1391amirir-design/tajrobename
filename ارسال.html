<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ارسال تجربه | تجربه‌نامه</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #0f0f12;
      color: #ffffff;
    }

    .صفحه {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .جعبه ارسال {
      background: #19191f;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(255, 193, 7, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .توضیحات {
      color: #cccccc;
      line-height: 2;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #101014;
      color: white;
      font-family: Tahoma, sans-serif;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    .ناشناس {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
    }

    .ناشناس input {
      width: auto;
    }

    .دکمه {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      cursor: pointer;
      background: #d9a441;
      color: #111;
      font-weight: bold;
    }

    .بازگشت {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d9a441;
      text-decoration: none;
    }

    .پیام {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #173d24;
      color: #9ff0b5;
      line-height: 2;
    }
  </style>
</head>

<body>

  <div class="صفحه">

    <div class="جعبه ارسال">

      <h1>ارسال تجربه ✍️</h1>

      <p class="توضیحات">
        تجربه‌ات را برای ما بنویس.
        می‌توانی آن را کاملاً ناشناس ارسال کنی.
        پس از بررسی مدیر، تجربه در سایت منتشر خواهد شد.
      </p>

      <form
        action="https://docs.google.com/forms/d/e/1FAIpQLSffVVmWcHQq96ytu89JQhGmFUAUutqaUW7EI5CBge50w1t7ew/formResponse"
        method="POST"
        target="فرم مخفی"
        id="فرم ارسال"
        onsubmit="ارسال_شد()"
      >

        <label for="نام">نام (اختیاری)</label>

        <input
          type="text"
          id="نام"
          name="entry.1805025819"
          placeholder="اگر دوست داشتی نامت را بنویس"
        >

        <label for="تجربه">تجربه شما</label>

        <textarea،
          id="تجربه"
          name="entry.782202699"
          placeholder="تجربه‌ات را اینجا بنویس..."
          required
        ></textarea>

        <label class="ناشناس">
          <input
            type="checkbox"
            id="ارسال ناشناس"
            name="entry.783837524"
            value="بله، ناشناس باشد"
          >
          ارسال به صورت ناشناس
        </label>

        <button class="دکمه" type="submit">
          ارسال تجربه ✍️
        </button>

      </form>

      <div class="پیام" id="پیام">
        ✅ تجربه‌ات با موفقیت ارسال شد.
        <br>
        پس از بررسی مدیر، در سایت منتشر خواهد شد.
      </div>

      <iframe
        name="فرم مخفی"
        style="display:none;"
      ></iframe>

      <a class="بازگشت" href="index.html">
        ← بازگشت به صفحه اصلی
      </a>

    </div>

  </div>

  <script>
    function ارسال_شد() {
      document.getElementById("پیام").style.display = "block";
      document.getElementById("فرم ارسال").reset();
    }
  </script>

</body>
</html>
